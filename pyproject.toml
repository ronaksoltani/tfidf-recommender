[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfidf-movie-recommender"
version = "1.0.0"
description = "Explainable content-based movie recommendations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ronak Soltani"}]
dependencies = ["scikit-learn>=1.4", "pandas>=2.0"]

[project.scripts]
movie-recs = "movie_recommender.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
movie_recommender = ["catalog.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
